version: 3
tasks:
  install-languages:
    run: once
    status:
      - asdf current nodejs
    cmds:
      - asdf install

  install-dependencies:
    internal: true
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/**/*
    deps:
      - task: install-languages
    cmds:
      - asdf exec npm i

  update-dependencies:
    desc: Update all dependencies for the widgets
    deps:
      - task: install-languages
    cmds:
      - asdf exec npm update

  dev:
    desc: Build & watch the widgets
    deps:
      - task: install-dependencies
    cmds:
      - task: dev:run

  dev:run:
    internal: true
    deps:
      - task: dev:run-js
      - task: dev:run-css

  dev:run-js:
    internal: true
    cmd: asdf exec npm run watch

  dev:run-css:
    internal: true
    cmd: asdf exec npm run watch:styles

  build:
    desc: Build the widgets for production
    deps:
      - task: install-dependencies
    cmds:
      - asdf exec npm run build
      - asdf exec npm run build:styles

  lint:
    desc: Perform linting and code style checks on the widgets
    deps:
      - task: install-dependencies
    cmds:
      - asdf exec npm run lint

  test:
    desc: Run the test suite (pass vitest arguments after --)
    deps:
      - task: install-dependencies
    cmds:
      - asdf exec npm test -- {{.CLI_ARGS}}

  release:
    desc: Create a new release and publish it to GitHub & NPM
    deps:
      - task: install-dependencies
    cmds:
      - asdf exec npm run release
